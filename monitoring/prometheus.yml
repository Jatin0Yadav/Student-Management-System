global:
  scrape_interval: 5s

scrape_configs:

  - job_name: student-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - student-service:8080

  - job_name: department-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - department-service:8081

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification-service:8082

  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - audit-service:8083

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8084

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - config-server:8888

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - eureka-server:8761

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093